# ==============================================================================
# Render Blueprint Specification (Backend Realtime)
# ==============================================================================
services:
  - type: web
    name: salon-estudio-backend-realtime
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # URL(s) del frontend en Vercel, separadas por coma. Se configura en el panel de Render.
      - key: CORS_ORIGIN
        sync: false
      # JSON de la cuenta de servicio de Firebase (mismo proyecto que el Backend API).
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false

